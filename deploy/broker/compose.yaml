services:
  broker:
    build:
      context: ../..
      dockerfile: deploy/broker/Dockerfile
    env_file: bridge.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - broker-private:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  broker-private:
