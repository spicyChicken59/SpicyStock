# Keep every default detector. This exact public localStorage namespace is
# a browser record label, not a credential; its assignment/comparison triggers
# generic-api-key. Both the extracted value AND an exact code path must
# match. No file, commit, or detector is excluded.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public trade-journal localStorage namespace in its module and browser test"
condition = "AND"
regexTarget = "secret"
regexes = ['''^spicystock\.trade-journal\.v1$''']
paths = ['''^(docs/stockbee-plan\.js|docs/trade-state\.js|tools/research_cockpit_smoke\.mjs|tools/trade_state_checks\.mjs)$''']

[[rules.allowlists]]
description = "Public v2 trading-state localStorage namespace"
condition = "AND"
regexTarget = "secret"
regexes = ['''^spicystock\.trades\.v2$''']
paths = ['''^(docs/trade-state\.js|tools/trade_state_checks\.mjs|tools/trade_workflow_smoke\.mjs)$''']
