# Keep every default detector. No file, commit or detector is excluded; the
# one allowlist below is narrow on both the value and the path, and the
# condition is AND, so both have to match.
#
# The run's rules are records with a "key" field ("abnormal_10pct",
# "down25_quarter", "pct_above_40ma"): a lowercase identifier with digits
# next to the word key is what generic-api-key looks for, and every fixture
# and the record carry them. A credential does not look like that -- Alpaca
# keys are upper case, Anthropic's carry hyphens, Resend's mixed case -- so
# the value has to be a lowercase word with an underscore in it, and the
# path has to be a module, the record or a page fixture.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "A rule key (lowercase, underscored, digits allowed) in a module, the record or a page fixture"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[a-z]+[a-z0-9]*(_[a-z0-9]+)+$''']
paths = ['''^(src/[a-z0-9_]+\.py|docs/(data|picks)\.json|tests/fixtures/page/[a-z]+\.json)$''']
