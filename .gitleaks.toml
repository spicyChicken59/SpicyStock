# Keep every default detector. This exact public localStorage namespace is
# a browser record label, not a credential; its assignment/comparison triggers
# generic-api-key. Both the extracted value AND one of its two code paths must
# match. No file, commit, or detector is excluded.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public trade-journal localStorage namespace in its module and browser test"
condition = "AND"
regexTarget = "secret"
regexes = ['''^spicystock\.trade-journal\.v1$''']
paths = ['''^(docs/stockbee-plan\.js|tools/research_cockpit_smoke\.mjs)$''']
