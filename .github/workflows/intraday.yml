name: Intraday check (3:30 PM ET, dispatch only)
# Bonde's anticipation flow wants a late-afternoon look at the coiled names:
# is one clearing its trigger on volume above yesterday's? This run reads the
# previous evening's watchlist and trades from docs/data.json, asks Alpaca's
# snapshots for those names only (IEX for the price, delayed SIP for the
# consolidated partial-day volume), writes docs/live.json and mails a short
# "breakout in progress" digest when a name is confirmed. It never touches
# docs/data.json and never commits.
#
# SCHEDULE OFF ON PURPOSE. It is switched on after the evening run has
# published ten nights in a row (README, "Fourteen days"); until then it is a
# button. To switch it on, uncomment the schedule block: 3:30 PM ET is
# "30 19" while the US is on EDT and "30 20" on EST; a cron here arrives
# 5-17 minutes late, so schedule 3:15 PM and let the pipeline wait.
run-name: Intraday ${{ github.event_name }}
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "15 19 * * 1-5"   # 3:15 PM ET while US is on EDT
  #   - cron: "15 20 * * 1-5"   # 3:15 PM ET while US is on EST

permissions:
  contents: read

concurrency:
  group: intraday-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the intraday check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCAN_SEND_EMAIL: "true"
        run: python -m src.pipeline intraday
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-${{ github.run_id }}
          path: docs/live.json
          retention-days: 7
          if-no-files-found: ignore
