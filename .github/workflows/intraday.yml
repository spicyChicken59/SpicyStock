name: Intraday check (3:30 PM ET, dispatch only)
# Bonde's anticipation flow wants a late-afternoon look at the coiled names:
# is one clearing its trigger on volume above yesterday's? This run reads the
# previous evening's watchlist and trades from docs/data.json, asks Alpaca's
# snapshots for those names only (IEX for the price, delayed SIP for the
# consolidated partial-day volume), and writes docs/live.json. This is legacy
# research, not an entry verifier; source timestamps and exact publication
# bindings belong to morning.yml. It never emails, changes docs/data.json or
# commits. Its older "confirmed" field must not authorize a broker order.
#
# This legacy research path stays dispatch-only. Use morning.yml for the
# supported, publication-bound morning observation workflow.
run-name: Intraday ${{ github.event_name }}
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: intraday-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the intraday check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SCAN_SEND_EMAIL: "false"
        run: python -m src.pipeline intraday
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-${{ github.run_id }}
          path: docs/live.json
          retention-days: 7
          if-no-files-found: ignore
