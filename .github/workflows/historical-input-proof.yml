name: Historical input proof
run-name: historical-input-${{ inputs.mode }}

# A dedicated experiment with one narrowly reviewed failed-attempt recovery.
# Merging does not authorize dispatch by itself.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reviewed execution phase (only the replacement real slot is available)
        type: choice
        options: [rehearsal, real]
        default: rehearsal
        required: true
      readiness_comment_id:
        description: Numeric ID of the owner's dated PASS readiness comment on this implementation PR
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: spicystock-historical-input-2026-09-28
  cancel-in-progress: false

jobs:
  execution:
    name: execution
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      MANIFEST: docs/input-truthfulness/2026-09-28-historical-input-evidence/acquisition-manifest.json
      POLICY: tools/historical-execution-policy.json
      MODE: ${{ inputs.mode }}
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Refuse unintended dispatch context
        id: boundary
        env:
          RAW_READINESS_COMMENT_ID: ${{ inputs.readiness_comment_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'spicyChicken59/SpicyStock' ]]
          [[ "$GITHUB_REPOSITORY_ID" == '1352997802' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          # Normalize the untrusted input exactly once, without shell evaluation.
          # Only ASCII space and horizontal tab are permitted at its edges.
          READINESS_COMMENT_ID="$RAW_READINESS_COMMENT_ID"
          while [[ "$READINESS_COMMENT_ID" == ' '* || "$READINESS_COMMENT_ID" == $'\t'* ]]; do
            READINESS_COMMENT_ID="${READINESS_COMMENT_ID:1}"
          done
          while [[ "$READINESS_COMMENT_ID" == *' ' || "$READINESS_COMMENT_ID" == *$'\t' ]]; do
            READINESS_COMMENT_ID="${READINESS_COMMENT_ID:0:${#READINESS_COMMENT_ID}-1}"
          done
          if [[ ! "$READINESS_COMMENT_ID" =~ ^[1-9][0-9]*$ || "$READINESS_COMMENT_ID" == *[!0123456789]* ]]; then
            printf '%s\n' 'Invalid readiness comment ID: expected positive ASCII decimal digits, with only optional edge spaces/tabs.' >&2
            exit 1
          fi
          # These remain native run numbers. The guard independently verifies
          # the three zero-job failures, accepted rehearsal and exact native-5
          # pre-provider failure before admitting the replacement real phase.
          case "$MODE:$GITHUB_RUN_NUMBER" in real:6) ;; *) exit 1 ;; esac
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUNNER_TEMP" == /* && "$GITHUB_WORKSPACE" == /* ]]
          [[ -d "$RUNNER_TEMP" && -d "$GITHUB_WORKSPACE" ]]
          [[ "$RUNNER_TEMP" != *$'\n'* && "$RUNNER_TEMP" != *$'\r'* ]]
          historical_temp_parent="$(realpath -e -- "$RUNNER_TEMP")"
          historical_workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          [[ "$historical_temp_parent" != '/' && "$historical_temp_parent" != *$'\n'* && "$historical_temp_parent" != *$'\r'* ]]
          [[ "$historical_temp_parent" != "$historical_workspace" && "$historical_temp_parent" != "$historical_workspace/"* ]]
          historical_ancestor="$historical_temp_parent"
          while true; do
            [[ ! -e "$historical_ancestor/.git" ]]
            [[ "$historical_ancestor" != '/' ]] || break
            historical_ancestor="$(dirname -- "$historical_ancestor")"
          done
          HISTORICAL_ROOT="$historical_temp_parent/historical-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          MPLCONFIGDIR="$HISTORICAL_ROOT/matplotlib"
          export HISTORICAL_ROOT MPLCONFIGDIR
          umask 077
          mkdir -m 700 "$HISTORICAL_ROOT"
          mkdir -m 700 "$MPLCONFIGDIR"
          # GITHUB_ENV affects later steps only; the explicit exports above
          # are required by this step's mkdir and any child process.
          printf 'HISTORICAL_ROOT=%s\nMPLCONFIGDIR=%s\n' "$HISTORICAL_ROOT" "$MPLCONFIGDIR" >> "$GITHUB_ENV"
          printf 'readiness_comment_id=%s\n' "$READINESS_COMMENT_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install pinned historical runtime and verified age
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-historical-archive.txt
          python -m pip install -r tools/requirements-historical.txt
          python tools/install_historical_age.py --destination "$HISTORICAL_ROOT/age"
      - name: Verify reviewed revision, evidence and durable execution slot
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READINESS_COMMENT_ID: ${{ steps.boundary.outputs.readiness_comment_id }}
        run: |
          umask 077
          python tools/historical_execution_guard.py --policy "$POLICY" \
            --readiness-comment-id "$READINESS_COMMENT_ID" --mode "$MODE" \
            --output-dir "$HISTORICAL_ROOT/guard" --storage-root "$HISTORICAL_ROOT/data"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.guard.outputs.checkout_sha }}
          persist-credentials: false
      - name: Validate recipient before exposing provider credentials
        id: preflight
        run: |
          python tools/historical_execution.py --preflight-only --mode "$MODE" --manifest "$MANIFEST" \
            --storage "$HISTORICAL_ROOT/data" --execution "$HISTORICAL_ROOT/guard/execution.json" \
            --approval "$HISTORICAL_ROOT/guard/approval.json"
          python tools/historical_package.py validate-recipient \
            --policy "$POLICY" --age "$HISTORICAL_ROOT/age/age" --scratch "$HISTORICAL_ROOT"
      - name: Exercise actual tools with synthetic transport
        id: rehearsal
        if: inputs.mode == 'rehearsal'
        timeout-minutes: 30
        run: |
          umask 077
          python tools/historical_execution.py --mode rehearsal --manifest "$MANIFEST" \
            --storage "$HISTORICAL_ROOT/data" --execution "$HISTORICAL_ROOT/guard/execution.json" \
            --approval "$HISTORICAL_ROOT/guard/approval.json"
      - name: One historical acquisition under the original shared limits
        id: acquisition
        if: inputs.mode == 'real'
        timeout-minutes: 30
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          umask 077
          python tools/historical_execution.py --mode real --manifest "$MANIFEST" \
            --storage "$HISTORICAL_ROOT/data" --execution "$HISTORICAL_ROOT/guard/execution.json" \
            --approval "$HISTORICAL_ROOT/guard/approval.json"
      - name: Reconcile complete or partial retained inputs with sockets blocked
        if: always() && steps.preflight.outcome == 'success'
        timeout-minutes: 30
        run: |
          umask 077
          python tools/historical_execution.py --mode offline --manifest "$MANIFEST" \
            --storage "$HISTORICAL_ROOT/data" --execution "$HISTORICAL_ROOT/guard/execution.json"
      - name: Encrypt only permitted evidence, including handled failures
        id: package
        if: always() && steps.preflight.outcome == 'success'
        timeout-minutes: 10
        run: |
          umask 077
          python tools/historical_package.py package --manifest "$MANIFEST" \
            --storage "$HISTORICAL_ROOT/data" --execution "$HISTORICAL_ROOT/guard/execution.json" \
            --policy "$POLICY" --age "$HISTORICAL_ROOT/age/age" --delivery "$HISTORICAL_ROOT/delivery"
      - name: Upload ciphertext transport and non-sensitive receipt
        id: artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}
          path: |
            ${{ env.HISTORICAL_ROOT }}/delivery/evidence.tar.zst.age
            ${{ env.HISTORICAL_ROOT }}/delivery/receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          overwrite: false
      - name: Bind public receipt to the immutable artifact identity
        if: always() && steps.artifact.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['HISTORICAL_ROOT'])
          artifact_id, artifact_digest = os.environ['ARTIFACT_ID'], os.environ['ARTIFACT_DIGEST']
          assert re.fullmatch(r'[1-9][0-9]*', artifact_id)
          assert re.fullmatch(r'[0-9a-f]{64}', artifact_digest)
          receipt = json.loads((root / 'delivery/receipt.json').read_bytes())
          receipt.update(artifact_id=int(artifact_id), github_artifact_digest=artifact_digest)
          public = json.dumps(receipt, sort_keys=True, indent=2) + '\n'
          (root / 'artifact-receipt.json').write_text(public)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Ciphertext transport only. Local recovery is NOT RUN.\n\n```json\n' + public + '```\n')
          PY
