name: Probe Nasdaq directory reachability
# TEMPORARY, branch-scoped. The matrix version of this file (run 34414747241)
# settled that api.nasdaq.com answers a browser's User-Agent from a GitHub-
# hosted runner and nothing else. This version runs the pipeline's own
# fetch_directory(), as changed on this branch, from a real runner -- the
# boundary the offline suite cannot cross -- and is deleted once read.
on:
  workflow_dispatch:
  push:
    branches: [claude/spicy-stock-run-failure-jvx7z0]
    paths: [.github/workflows/probe-nasdaq.yml, src/universe.py]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: The pipeline's own fetch_directory(), from this runner
        run: |
          python - <<'EOF'
          import logging, time
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
          from src import universe
          print("headers:", universe.DIRECTORY_HEADERS)
          t0 = time.monotonic()
          rows = universe.fetch_directory()
          print(f"fetch_directory() returned {len(rows)} listings in {time.monotonic() - t0:.1f}s")
          pool, reasons = universe.directory_pool(rows, [])
          print(f"directory_pool(): {len(pool)} eligible; exclusions {reasons}")
          EOF
