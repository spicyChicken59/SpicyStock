name: Tests
# The offline regression suite. Every external boundary the pipeline touches
# (Alpaca, Anthropic, Resend) is replaced by a double in tests/fakes.py and
# tests/conftest.py severs socket connect(), so this job needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same runtime as evening.yml
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -q
      - name: Fail if the suite dirtied the working tree
        run: |
          set -euo pipefail
          git rev-parse --is-inside-work-tree > /dev/null \
            || { echo "Not a git checkout — this check cannot answer, so it fails."; exit 1; }
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "The test suite left files behind:"
            echo "$dirty"
            exit 1
          fi

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the page against every fixture and read it back
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          set -o pipefail
          node tools/chart_check.mjs
          node tools/page_smoke.mjs --shots /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-shots
          path: /tmp/shots
          if-no-files-found: ignore
