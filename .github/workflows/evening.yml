name: Evening scan (6:16 PM ET)
# The one scheduled run. It reads the whole US common-stock market after the
# close, grades tonight's bursts, writes docs/data.json + docs/picks.json and
# commits them back so GitHub Pages can publish the plan for tomorrow.
#
# Two cron pairs, because GitHub crons are UTC and the US switches between
# EDT and EST: the guard below runs only the slot that matches today's offset.
#   6:16 PM ET  -> "16 22" (EDT) / "16 23" (EST)   the primary run
#   8:16 PM ET  -> "16 0"  (EDT) / "16 1"  (EST)   the retry, next UTC day
# The retry runs only when docs/data.json does not already hold tonight's
# session (a failed or late primary), so a normal night runs once. Measured
# lateness on this repository is 5-17 minutes per slot, never zero.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (inputs.dry_run == true && 'Evening rehearsal'
          || (inputs.session != '' && format('Evening backfill {0}', inputs.session)
              || 'Evening dispatch'))
      || format('Evening cron {0}', github.event.schedule) }}
on:
  schedule:
    - cron: "16 22 * * 1-5"   # primary while US is on EDT (UTC-4)
    - cron: "16 23 * * 1-5"   # primary while US is on EST (UTC-5)
    - cron: "16 0 * * 2-6"    # retry while US is on EDT (8:16 PM ET = 00:16 UTC next day)
    - cron: "16 1 * * 2-6"    # retry while US is on EST
  workflow_dispatch:
    inputs:
      session:
        description: "Backfill: the session to scan, YYYY-MM-DD. Leave empty to scan the newest session the bars carry."
        required: false
        default: ""
      dry_run:
        description: "Rehearse: scan, grade and write the record into this run's artifact, but mail nothing and commit nothing back."
        type: boolean
        required: false
        default: false
      skip_email:
        description: "Publish a real record without sending email."
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # the run commits docs/ back; see "Persist the run"
  actions: read

concurrency:
  group: evening-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Guard — the slot for today's UTC offset; the retry only if tonight is unpublished
        id: guard
        run: |
          set -o pipefail
          OFFSET=$(TZ=America/New_York date +%z)   # -0400 = EDT, -0500 = EST
          if [ "$OFFSET" = "-0400" ]; then PRIMARY="16 22 * * 1-5"; RETRY="16 0 * * 2-6"
          else PRIMARY="16 23 * * 1-5"; RETRY="16 1 * * 2-6"; fi
          FIRED="${{ github.event.schedule }}"
          GO=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GO=true
          elif [ "$FIRED" = "$PRIMARY" ]; then
            GO=true
          elif [ "$FIRED" = "$RETRY" ]; then
            # Tonight's session is today's date in market time (it is still the
            # evening in New York at 8:16 PM). Run only if the committed record
            # does not already carry it; a holiday publishes a "closed" record
            # for the previous session, whose expected_session is today, so it
            # counts as published too.
            SESSION=$(TZ=America/New_York date +%Y-%m-%d)
            if jq -e --arg s "$SESSION" \
              '(.run.session == $s) or (.run.expected_session == $s)' docs/data.json > /dev/null 2>&1; then
              echo "Retry: tonight ($SESSION) is already published — skipping."
            else
              GO=true
              echo "Retry: no record for $SESSION — running now."
            fi
          else
            echo "Not this slot ($FIRED; offset $OFFSET) — skipping."
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Run evening pipeline
        id: pipeline
        if: steps.guard.outputs.go == 'true'
        env:
          MPLBACKEND: Agg
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Repository VARIABLES (not secrets): the feed, the universe mode and
          # the account the plans are sized for. Unset expands to '' = default.
          SCAN_FEED: ${{ vars.SCAN_FEED }}
          SCAN_UNIVERSE: ${{ vars.SCAN_UNIVERSE }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          SCAN_SEND_EMAIL: ${{ inputs.skip_email == true && 'false' || 'true' }}
          SCAN_SESSION_DATE: ${{ inputs.session }}
          DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}
          GITHUB_RUN_ID_FOR_RECORD: ${{ github.run_id }}
        # The exit code is captured here and raised at the end of the job, so
        # that "Persist the run" can keep a DEGRADED (2) or FAILED-AFTER-
        # PUBLISH (3) record: both wrote a complete docs/data.json.
        run: |
          set +e
          python -m src.pipeline evening $DRY_RUN_FLAG
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          session=$(python -c 'import json;print(json.load(open("docs/data.json"))["run"]["session"])' 2>/dev/null || true)
          echo "session=$session" >> "$GITHUB_OUTPUT"
          echo "pipeline exited ${code}"
      - name: Persist the run
        # 0 is clean, 2 is DEGRADED-but-published, 3 is FAILED-after-publishing.
        # Only 1 means there is nothing trustworthy to commit. Never a rehearsal.
        if: >-
          steps.guard.outputs.go == 'true'
          && inputs.dry_run != true
          && (steps.pipeline.outputs.code == '0' || steps.pipeline.outputs.code == '2'
              || steps.pipeline.outputs.code == '3')
        # `git add docs` -- charts/*.png are gitignored and skipped. The retry
        # loop really runs three times (traced with bash -ex against a stub
        # git); a conflict is a failure, not something to paper over.
        run: |
          git config user.name  "spicystock"
          git config user.email "actions@github.com"
          git add docs
          git diff --staged --quiet && exit 0
          SESSION=$(python -c 'import json;print(json.load(open("docs/data.json"))["run"]["session"])' 2>/dev/null || true)
          if [ -n "$SESSION" ]; then
            git commit -m "run $SESSION"
          else
            git commit -m "run (session unknown; committed $(date -u +%F))"
          fi
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push $attempt was rejected — rebasing onto what landed during the run"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::rebase onto ${GITHUB_REF_NAME} conflicted; docs/ was not pushed — the record is in this run's artifact."
              exit 1
            fi
          done
          echo "::error::docs/ could not be pushed after 3 attempts; tonight's record did not reach the branch."
          exit 1
      - name: Keep the run's artifacts
        if: (success() || failure()) && steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dry_run == true && format('evening-dryrun-{0}', github.run_id) || ((steps.pipeline.outputs.code == '0' || steps.pipeline.outputs.code == '2' || steps.pipeline.outputs.code == '3') && steps.pipeline.outputs.session != '' && format('evening-{0}-{1}', steps.pipeline.outputs.session, github.run_id) || format('evening-failed-{0}', github.run_id)) }}
          path: |
            docs/data.json
            docs/picks.json
            docs/charts/
          retention-days: 30
      - name: Report the pipeline's verdict
        # Exit 2 (degraded but published) is a warning, not a red run: a
        # degraded night that published is a night that worked, and a week of
        # red taught the owner to ignore red. 1 and 3 stay red.
        if: steps.guard.outputs.go == 'true'
        run: |
          code=${{ steps.pipeline.outputs.code }}
          if [ "$code" = "2" ]; then
            echo "::warning::The run published but was DEGRADED — read run.problems on the page."
            exit 0
          fi
          exit $code
