name: Evening scan (6:16 PM ET)
on:
  schedule:
    # These crons ARE the trigger. An earlier design used an external scheduler
    # (cron-job.org) hitting workflow_dispatch, with these as backup; that is no
    # longer set up and you do not need it. The guard below still works
    # standalone: the first matching cron of the day finds no results artifact
    # and runs. Both crons are registered; the guard no-ops the wrong one for
    # the current DST offset, so the effective fire time is 6:16 PM ET.
    - cron: "16 22 * * 1-5"   # backup while US is on EDT (UTC-4)
    - cron: "16 23 * * 1-5"   # backup while US is on EST (UTC-5)
  workflow_dispatch: {}
permissions:
  contents: write   # the run commits docs/ back; see "Persist the run" below
  actions: read

# One scan at a time. An overlapping manual run would double the day's Claude
# spend and race the other run's push.
concurrency:
  group: evening-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Guard — external dispatch runs always; backup cron only if needed
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFSET=$(TZ=America/New_York date +%z)   # -0400 = EDT, -0500 = EST
          if [ "$OFFSET" = "-0400" ]; then BACKUP="16 22 * * 1-5"; else BACKUP="16 23 * * 1-5"; fi
          FIRED="${{ github.event.schedule }}"
          GO=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GO=true   # primary path: external scheduler or manual run
          elif [ "$FIRED" = "$BACKUP" ]; then
            TODAY=$(date -u +%Y-%m-%d)
            DONE=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              -q "[.artifacts[] | select((.name|startswith(\"evening-\")) and (.created_at|startswith(\"$TODAY\")))] | length" \
              2>/dev/null || echo "0")
            if [ "$DONE" = "0" ]; then
              GO=true
              echo "Backup trigger: no successful evening run today — running now."
            else
              echo "Backup trigger: evening run already completed today — skipping."
            fi
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "offset=$OFFSET fired='$FIRED' -> go=$GO"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Run evening pipeline
        if: steps.guard.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m src.pipeline evening
      - name: Persist the run
        if: steps.guard.outputs.go == 'true'
        # Without this the ledger cannot accumulate: docs/ is written inside the
        # container and dies with it, so every CI run would start a fresh
        # history and the forward returns step 9 exists to collect would never
        # span more than one session. Market data is live-only — a rejected push
        # discards a snapshot that cannot be re-fetched — so rebase onto
        # whatever landed during the run and retry.
        #
        # `git add docs` — NOT `git add docs results`. results/ is gitignored on
        # purpose (README, "Notes"), and `git add` on an ignored path exits 1,
        # which under Actions' `bash -e` aborted this step before the commit on
        # every single run. docs/ was staged and never committed, the container
        # took it, and the history this exists to accumulate restarted every
        # night while the workflow reported it was being kept. Step 10 found it
        # by running `git add` against these rules rather than reading them:
        # both the streaks and the morning follow-through are built on this
        # step actually working.
        run: |
          git config user.name  "spicystock"
          git config user.email "actions@github.com"
          git add docs
          git diff --staged --quiet && exit 0
          git commit -m "run $(date -u +%F)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push
      - name: Keep the run's artifacts
        # always(), not failure(), and two reasons for the change. It is the
        # 30-day copy of results/*.csv README documents — which a failure-only
        # upload never produced on a run that worked. And it is the "an evening
        # run already happened today" signal the guard above queries: until the
        # `git add` fix above, that signal existed only because the persist step
        # failed on every single run, so repairing that step would otherwise
        # have quietly deleted the guard's only input.
        if: always() && steps.guard.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evening-${{ github.run_id }}
          path: |
            docs/data.json
            docs/ledger.json
            results/
          retention-days: 30
