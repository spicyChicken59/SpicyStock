name: Secret scan
# The .gitignore blocks credential filenames we can predict. This catches the
# rest — a key pasted into an arbitrary file, a log committed by accident, or
# a secret in a commit message — and it is enforced in the repo rather than
# depending on a GitHub setting nobody can verify from here.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history, not just the tip commit
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
