name: Secret scan
# The .gitignore blocks credential filenames we can predict. This catches the
# rest: a key pasted into an arbitrary file, or a log committed by accident.
# It scans patch CONTENT, so a secret in a commit message is not covered —
# GitHub push protection is the layer for that.
#
# On push/pull_request gitleaks-action scans only the pushed commit range. The
# weekly schedule and the manual trigger below are what scan full history.
#
# Note: gitleaks-action@v2 is free for personal-account repos but requires a
# GITLEAKS_LICENSE secret if this repo ever moves to an organization, where it
# will otherwise exit 1.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC — full-history sweep
permissions:
  contents: read
  # gitleaks-action lists the pull request's commits to decide what to scan,
  # so on a pull_request event it needs this and dies without it: the first
  # PR this repo ever opened failed here with a 403 "Resource not accessible
  # by integration" naming pull_requests=read, before scanning a single
  # commit. The push trigger passes because that path calls no PR API — so
  # the job was green on every push while being incapable of ever running on
  # a PR, which is the shape of failure that looks like coverage.
  pull-requests: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan history, not just the tip commit
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
